# Enable/disable rate limiting
rate.limit.enabled=true

# Example: Login endpoint (10 requests per minute)
rate.limit.config[/api/auth/login].limit=10
rate.limit.config[/api/auth/login].window=120

# Example: Register endpoint (3 requests per hour)
rate.limit.config[/api/auth/register].limit=3
rate.limit.config[/api/auth/register].window=3600