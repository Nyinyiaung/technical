# Enable/disable rate limiting
rate.limit.enabled=true

# Default rate limit (100 requests per 60 seconds)
rate.limit.df.limit=100
rate.limit.df.window=60

# Example: Login endpoint (10 requests per minute)
rate.limit.config[/api/auth/login].limit=10
rate.limit.config[/api/auth/login].window=60

# Example: Register endpoint (3 requests per hour)
rate.limit.config[/api/auth/register].limit=3
rate.limit.config[/api/auth/register].window=3600

# Exclude patterns (endpoints to exclude from rate limiting)
rate.limit.exclude[0]=/api/users/**

# Include patterns (if you want to explicitly include endpoints)
rate.limit.include[0]=/api/auth/**